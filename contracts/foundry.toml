[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# solc version intentionally unset: Foundry picks the latest, which supports
# the "prague" EVM target required by Monad.
evm_version = "prague"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
# Monad testnet — chain id 10143
monad_testnet = "https://testnet-rpc.monad.xyz"

