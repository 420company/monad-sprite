# Minimal CI for the 0x4 web app: typecheck, build, unit tests.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 0x4-web (typecheck, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/0x4-web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/0x4-web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Build the web surface, which is what gets deployed
      - name: Build
        run: npx vite build
        env:
          VITE_SURFACE: web

      # Front-end unit tests only: `npm test` also runs server/ tests, and the backend is not in this repo
      - name: Unit tests
        run: npx vitest run
